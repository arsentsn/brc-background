<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRC Menu</title>
  <!-- Tab icon: the menu's brain, cut from the game's own sprite (Sprite/MainMenuBrain, rect
     1393,0,131,157 of MainmenuSpriteAtlas) rather than out of the composited screen, so only
     the line-work is opaque. Stretched to a square to fill the tab. -->
  <link rel="icon" type="image/png" href="assets/menu/favicon.png">
  <style>
    :root {
      color-scheme: dark;
    }

    /* Two typefaces, both the game's, both registered by views/menuview.js from assets/menu/:
     'InductionLocal' (induction.ttf) sets the menu items and window titles, 'FuturistLocal'
     (forgotten-futurist-rg.ttf, the game's Forgotten Futurist) sets the options window.
     Anything set in either falls back to monospace when assets/ is absent. */
    html,
    body {
      margin: 0;
      height: 100%;
      background: #0c0c0e;
      overflow: hidden;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    /* First-paint gate: the marble draws on frame 1, but the overlay image and menu font
     arrive asynchronously, so the body starts hidden until they settle. Must be an
     instant flip, not a fade: CSS transitions do not advance under headless virtual
     time, so every --screenshot would capture opacity 0 (docs/TOOLING.md). */
    body.booting {
      opacity: 0;
    }

    /* Cached assets can lift the paint gate faster than the .35s slide, which would show the
     window mid-flight on a page it was never opened on. Transitions return with the gate. */
    body.booting #panel {
      transition: none !important;
    }

    #gl {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* ---- reconstructed screens (docs/SCREENS.md) ----------------------------------------
     Layout, intro timings and window masks live in views/menuview.css. These base rules
     stay here because the markup they hide ships in this file: they keep the menu items
     and slot texts from rendering as loose page text before views/menuview.js flips .on. */
    #menuview,
    #slateview {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      pointer-events: none;
    }

    /* ---- the options window --------------------------------------------------------
     One skin everywhere: the hud button and the menu's options item both live inside this
     window, so a conditional skin would restyle the controls under the click that just used
     them. Colours are the menu's own: rgb(223,222,192) page, rgb(236,232,203) panel,
     rgb(255,134,0) interactive. Docked off the top edge until dragged (see #panel.moved). */
    #panel {
      position: fixed;
      top: 0;
      left: 4.2vw;
      z-index: 10;
      /* border-box so max-height below actually bounds the window: on content-box the 36px of
       vertical padding sat outside it, and a "fits the viewport" cap overflowed by exactly
       that much. The width clamp carries the same 40px of horizontal padding so the window
       renders at the width it always did. */
      box-sizing: border-box;
      width: clamp(340px, calc(26vw + 40px), 560px);
      /* Height follows the controls: one fixed number would arbitrate a scaling screen, leaving
       dead cream under the last row on a tall viewport and a scroll on a short one. The
       max-height is what a short viewport gets instead. */
      height: auto;
      padding: 18px 20px;
      border: none;
      border-radius: 0 0 24px 24px;
      background: rgb(236, 232, 203);
      color: #2b2a22;
      /* The window's own face, the one the game sets its options text in. Everything
       inherits it, controls and digit readouts alike. */
      font-family: 'FuturistLocal', ui-monospace, Menlo, Consolas, monospace;
      font-size: 14px;
      user-select: none;
      /* the window carries enough controls to outgrow a short viewport */
      max-height: calc(100vh - 16px);
      overflow-y: auto;
      overscroll-behavior: contain;
      /* The bar itself is hidden: it cut a grey channel down the cream and across the
       rounded corners. Wheel, trackpad and touch still scroll. */
      scrollbar-width: none;
      /* Firefox */
      /* The page is color-scheme:dark, which paints unfilled range tracks and number-input
       internals near-black on cream, and accent-color covers only the fill and thumb. */
      color-scheme: light;
      transform: translateY(-100%);
      visibility: hidden;
      /* visibility flips instantly inbound and only after the slide outbound, so a closed
       window leaves hit-testing without display:none killing the animation */
      transition: transform .35s cubic-bezier(.33333, .66667, .66667, 1), visibility 0s .35s;
    }

    /* Chrome, Edge and Safari take the bar away only through the pseudo-element. */
    #panel::-webkit-scrollbar {
      display: none;
    }

    #panel.open {
      transform: none;
      visibility: visible;
      transition: transform .35s cubic-bezier(.33333, .66667, .66667, 1), visibility 0s 0s;
    }

    /* Dragged out of the dock: rounds off on every corner and fades rather than sliding,
     since sliding off the top edge means nothing from the middle of the screen. */
    #panel.moved {
      border-radius: 24px;
      max-height: calc(100vh - 24px);
      box-shadow: 0 10px 30px rgba(31, 30, 23, .28);
      transform: translateY(-6px);
      opacity: 0;
      transition: transform .2s ease, opacity .2s ease, visibility 0s .2s;
    }

    #panel.moved.open {
      transform: none;
      opacity: 1;
      transition: transform .2s ease, opacity .2s ease, visibility 0s 0s;
    }

    /* Header, and the drag handle: the grab cursor appears only once dragging is armed
     (.grab), and never over the buttons the header contains. */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 13px;
    }

    .hdr .icons {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    #panel.grab>.hdr {
      cursor: grab;
    }

    #panel.dragging>.hdr {
      cursor: grabbing;
    }

    /* The title stays in the menu face, so the window is headed the way every other screen
     is; only its body is Futurist. The diamond is not in Futurist's cmap either. It carries
     the menu's orange rather than the body's near-black: the game heads its own screens in
     dark art, and this is the one window that is this project's rather than the game's. */
    #panel h1 {
      font-family: 'InductionLocal', ui-monospace, monospace;
      font-size: 19px;
      margin: 0;
      letter-spacing: .1em;
      color: rgb(255, 134, 0);
      text-transform: lowercase;
    }

    button.icon {
      display: flex;
      align-items: center;
      padding: 3px 4px;
      background: none;
      border-color: transparent;
      color: #6c6954;
    }

    /* The inline width/height on the glyphs are the fallback; these keep them in step with
     the type around them. */
    button.icon svg {
      width: 14px;
      height: 14px;
    }

    button.icon:hover {
      background: rgb(223, 222, 192);
      border-color: rgb(203, 200, 168);
      color: rgb(255, 134, 0);
    }

    /* white on orange is the game's own highlight treatment (docs/SCREENS.md) */
    button.icon.on {
      background: rgb(255, 134, 0);
      border-color: rgb(255, 134, 0);
      color: #fff;
    }

    /* A kept preset is one pill with a real delete button, so it is keyboard-reachable. The
     unnamed working copy wears the same pill with the name field in place of the button, and
     is outlined rather than filled: that is the visible difference between a look you are
     deciding on and one you kept. */
    .pill {
      display: flex;
      min-width: 0;
    }

    .pill> :first-child {
      flex: 1 1 0;
      min-width: 0;
      border-radius: 8px 0 0 8px;
      border-right-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill>.del {
      flex: 0 0 auto;
      border-radius: 0 8px 8px 0;
      padding: 8px 9px;
      color: #6c6954;
    }

    .pill>.del:hover {
      background: #e7cfc0;
      border-color: #c9a189;
      color: #a2372a;
    }

    /* The button fill, not `none`: transparent let the panel's rgb(236,232,203) through while
     the x beside it kept the button's rgb(223,222,192), so one pill read as two colours. */
    .nameit {
      background: rgb(223, 222, 192);
      border: 1px solid rgb(255, 134, 0);
      color: rgb(255, 134, 0);
      padding: 8px 7px;
      font-family: inherit;
      font-size: 13px;
    }

    .nameit::placeholder {
      color: rgb(255, 134, 0);
      opacity: .6;
    }

    .nameit:focus {
      background: rgb(231, 229, 199);
      outline: none;
    }

    /* the hover fill, as buttons use */
    .pill.scratch>.del {
      border-color: rgb(255, 134, 0);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0;
    }

    .row label {
      color: #4c4a3a;
    }

    .row input[type=range] {
      flex: 1;
    }

    .val {
      width: 54px;
      text-align: right;
      color: #1f1e17;
    }

    .swatches {
      display: flex;
      gap: 5px;
      flex: 1 1 0;
      min-width: 0;
      justify-content: flex-end;
    }

    /* The loop row: play toggle, phase scrubber, and the clock value as an editable chip.
     It sits in the .val column and reads as a readout until hovered; the border is always
     there and only gains colour, so nothing shifts. Spinners are gone: the scrubber and
     the arrow keys are the stepping. */
    #looprow input[type=number] {
      flex: 0 0 46px;
      width: 46px;
      text-align: right;
      padding: 3px;
      background: none;
      border-color: transparent;
      color: #1f1e17;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    #looprow input[type=number]:hover {
      border-color: rgb(203, 200, 168);
    }

    #looprow input[type=number]:focus {
      background: rgb(223, 222, 192);
      border-color: rgb(203, 200, 168);
    }

    #looprow input[type=number]::-webkit-inner-spin-button,
    #looprow input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      display: none;
    }

    input[type=color] {
      width: 32px;
      min-width: 0;
      height: 26px;
      padding: 0;
      border: 1px solid rgb(203, 200, 168);
      border-radius: 4px;
      background: none;
      cursor: pointer;
    }

    input[type=color]::-webkit-color-swatch-wrapper {
      padding: 1px;
    }

    input[type=color]::-webkit-color-swatch {
      border: none;
      border-radius: 3px;
    }

    select,
    input[type=number] {
      flex: 1 1 0;
      min-width: 0;
      background: rgb(223, 222, 192);
      color: #33322a;
      border: 1px solid rgb(203, 200, 168);
      border-radius: 4px;
      padding: 3px 5px;
      font-family: inherit;
      font-size: 13px;
    }

    /* Every number in the window: the window's own face, asked for figures of one width.
     Forgotten Futurist ships none (at 100px its 1 is 28px against 53px for 0), so digits
     still wander inside the column; its right edge is what holds still. */
    .val,
    #readout,
    input[type=number] {
      font-variant-numeric: tabular-nums;
    }

    /* The UA widget keeps a dark groove whatever color-scheme says, so the track is painted
     outright. The filled half is a gradient stop driven by --p, which bind() sets from the
     value, since appearance:none loses the fill. */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 16px;
      background: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(to right, rgb(255, 134, 0) 0 var(--p, 0%), rgb(206, 203, 170) var(--p, 0%) 100%);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      margin-top: -4.5px;
      border: none;
      border-radius: 50%;
      background: rgb(255, 134, 0);
    }

    input[type=range]::-moz-range-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(to right, rgb(255, 134, 0) 0 var(--p, 0%), rgb(206, 203, 170) var(--p, 0%) 100%);
    }

    input[type=range]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: rgb(255, 134, 0);
    }

    /* auto-fit: any number of buttons wraps instead of overflowing the panel */
    .btnrow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
      gap: 8px;
      margin-top: 11px;
    }

    /* The HUD row is one axis in three states: `off` takes only its label and the two screens
     split the rest. Flex rather than the grid above, so the row still fills when the slate
     segment is absent on a build without its assets. */
    #hudrow {
      display: flex;
    }

    #hudrow>button {
      flex: 1 1 0;
    }

    #hudrow>#b_hud {
      flex: 0 0 auto;
      padding-left: 12px;
      padding-right: 12px;
    }

    /* wider track for the longer action labels: two per line, toggles paired 2x2 */
    .btnrow.wide {
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    }

    button {
      min-width: 0;
      background: rgb(223, 222, 192);
      color: #33322a;
      border: 1px solid rgb(203, 200, 168);
      border-radius: 8px;
      padding: 8px 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }

    button:hover {
      background: rgb(231, 229, 199);
    }

    /* one class for every lit state: toggles that are on, and the active preset */
    button.on {
      background: rgb(255, 134, 0);
      border-color: rgb(255, 134, 0);
      color: #fff;
    }

    button.on:hover {
      background: rgb(255, 150, 30);
    }

    :focus-visible {
      outline: 2px solid rgb(255, 134, 0);
      outline-offset: 1px;
    }

    /* which preset rows are reconstructions and which are this project's own (PROVENANCE.md) */
    .cap {
      display: block;
      margin: 11px 0 0;
      color: #8b8770;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .cap+.btnrow {
      margin-top: 5px;
    }

    /* Tucked up against the loop row rather than floating between two rows: it is that row
     read back, so the gap above it is smaller than the gap below. Right-aligned for the
     same reason: it lands under the value column, where the figures it derives from are. */
    #looprow {
      margin-bottom: 3px;
    }

    #readout {
      margin: 0 0 5px;
      color: #6c6954;
      font-size: 12px;
      text-align: right;
    }

    #tag {
      position: fixed;
      bottom: 10px;
      right: 14px;
      z-index: 10;
      color: #6a6a54;
      font-size: 12px;
    }

    /* Last thing in the panel: who rebuilt this and where the source lives. Same voice as
     #readout, quieter than any control, so it reads as colophon rather than UI. */
    .credit {
      margin-top: 11px;
      color: #6c6954;
      font-size: 12px;
      text-align: right;
    }

    .credit a {
      color: inherit;
    }

    .credit a:hover {
      color: rgb(255, 134, 0);
    }

    /* The bar: hidden outside the portrait block above, and it names what is on screen as well
     as opening the sheet. Its height is known so the sheet can reserve exactly it and the
     closed transform stays a plain translateY(100%) that hides both together. */
    :root {
      --barh: 56px;
    }

    #mobilebar {
      display: none;
      position: fixed;
      z-index: 11;
      left: 0;
      right: 0;
      bottom: 0;
      box-sizing: content-box;
      height: var(--barh);
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px env(safe-area-inset-bottom);
      background: rgb(236, 232, 203);
      color: #1f1e17;
      border: none;
      box-shadow: 0 -4px 18px rgba(31, 30, 23, .18);
      font-family: 'InductionLocal', ui-monospace, monospace;
      font-size: 17px;
      letter-spacing: .1em;
      text-transform: lowercase;
      text-align: left;
    }

    #mobilebar .now {
      font-family: 'FuturistLocal', ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0;
      color: #6c6954;
      text-transform: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Lit while the sheet is up, the same white-on-orange every other active control uses. */
    #mobilebar.on {
      background: rgb(255, 134, 0);
      color: #fff;
    }

    #mobilebar.on .now {
      color: rgba(255, 255, 255, .82);
    }

    /* ---- touch ------------------------------------------------------------
     Any coarse pointer, in either orientation. Everything here is size: a 12px slider thumb
     and a 22px swatch that a mouse hits exactly and a finger does not, grown to the ~44px
     both platform guidelines ask for. Layout and behaviour are the portrait block below. */
    @media (pointer: coarse) {
      #panel {
        font-size: 16px;
        padding: 18px;
      }

      .row {
        margin: 13px 0;
      }

      button {
        padding: 11px 10px;
        font-size: 15px;
        border-radius: 10px;
      }

      .pill> :first-child {
        border-radius: 10px 0 0 10px;
      }

      .pill>.del {
        border-radius: 0 10px 10px 0;
        padding: 11px 13px;
      }

      .nameit {
        padding: 11px 10px;
        font-size: 15px;
      }

      button.icon {
        padding: 9px 10px;
      }

      button.icon svg {
        width: 16px;
        height: 16px;
      }

      .cap {
        font-size: 13px;
        margin: 20px 0 0;
      }

      #readout {
        font-size: 13px;
        margin: 0 0 8px;
      }

      .credit {
        font-size: 13px;
        margin-top: 14px;
      }

      .val {
        width: 66px;
        font-size: 15px;
      }

      input[type=color] {
        width: 40px;
        height: 34px;
      }

      .swatches {
        gap: 6px;
      }

      /* The thumb is the target, so the whole control grows around it: the track stays thin
       and the extra height is hit area either side of it. margin-top is (track - thumb)/2. */
      input[type=range] {
        height: 30px;
      }

      input[type=range]::-webkit-slider-runnable-track {
        height: 4px;
      }

      input[type=range]::-webkit-slider-thumb {
        width: 24px;
        height: 24px;
        margin-top: -10px;
      }

      input[type=range]::-moz-range-track {
        height: 4px;
      }

      input[type=range]::-moz-range-thumb {
        width: 24px;
        height: 24px;
      }

      #looprow input[type=number] {
        flex: 0 0 62px;
        width: 62px;
        padding: 9px 6px;
        font-size: 15px;
      }
    }

    /* ---- portrait: the window becomes a sheet -----------------------------
     The reconstruction is a landscape composition in vw/vh, so portrait drops it and runs the
     marble full-bleed, with a bottom bar opening the controls over the lower half. Overlay,
     never a push: field scale is width-derived, so resizing the canvas to make room would
     rescale the swirl every time the sheet moved. */
    @media (max-width: 820px) and (orientation: portrait) {

      #menuview,
      #slateview,
      #tag {
        display: none !important;
      }

      #mobilebar {
        display: flex;
      }

      /* Slides up out of the bottom edge instead of down out of the top, and rounds off on
       the two corners that are now the leading ones. */
      #panel,
      #panel.moved {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-width: none;
        /* 50vh of controls plus the strip the bar sits over, so half the field stays visible
         and nothing scrolls in underneath the bar. */
        height: calc(50vh + var(--barh));
        max-height: calc(100vh - 40px);
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -8px 28px rgba(31, 30, 23, .22);
        transform: translateY(100%);
        opacity: 1;
        transition: transform .3s cubic-bezier(.33333, .66667, .66667, 1), visibility 0s .3s;
        padding-bottom: calc(var(--barh) + env(safe-area-inset-bottom) + 10px);
      }

      #panel.open,
      #panel.moved.open {
        transform: none;
        transition: transform .3s cubic-bezier(.33333, .66667, .66667, 1), visibility 0s 0s;
      }

      /* Dragging is off here (see armDrag), so the header is a title again, not a handle. */
      #panel.grab>.hdr,
      #panel.dragging>.hdr {
        cursor: default;
      }

      /* Nothing to switch between with no chrome on screen: off, central menu and slate menu
       would render identically. The material choice lives on in the presets row, where
       "menu swirl" and "slate swirl" already carry exactly it. */
      #hudrow,
      #hudcap {
        display: none !important;
      }
    }
  </style>

  <!-- Assets for the reconstructed screens ship in assets/; the code that draws them is in
     views/ (PROVENANCE.md). document.write keeps both loads synchronous and ordered:
     reference.js before the main script, the view styles before first paint. -->
  <script>
    (function () {
      // One path for every asset, resolving the same on a checkout, a file:// URL and a
      // hosted build. The view script still probes before drawing, so a missing assets/
      // degrades to the rebuilt chrome instead of breaking.
      window.EVIDENCE = 'assets/';
      window.WORKSPACE = true;
      document.write('<link rel="stylesheet" href="views/menuview.css">');
      document.write('<script src="' + window.EVIDENCE + 'reference.js"><\/script>');
    })();
  </script>
</head>

<body class="booting">
  <canvas id="gl"></canvas>
  <!-- The two reconstructed screens. Inert on their own: hidden by the base rule above
     until views/menuview.js probes assets/ and flips .on. #mv_overlay gets a src only
     after that probe succeeds. -->
  <div id="menuview">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="hlbackdrop" x="-8%" y="-60%" width="116%" height="220%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" />
        <feComponentTransfer>
          <feFuncA type="linear" slope="22" intercept="-0.55" />
        </feComponentTransfer>
        <feOffset dx="-2.9" dy="2.3" result="under_a" />
        <feFlood flood-color="rgb(255,134,0)" />
        <feComposite in2="under_a" operator="in" result="under" />
        <feMerge>
          <feMergeNode in="under" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </svg>
    <!-- Marble-window mask for the intro. mask-type:alpha because the sprite's alpha is
       the window shape; the hrefs are set from JS after the asset probe. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <mask id="winmask" maskContentUnits="userSpaceOnUse" style="mask-type:alpha">
        <image id="wm_top" preserveAspectRatio="none" />
        <image id="wm_bot" preserveAspectRatio="none" />
        <!-- The same windows rebuilt without pixels: both sprites measure as flat white
           with one rounded end (radii 45/165 and 21/1080 of their height), so a rect with
           the matching rx is the sprite. Used when the art is absent; the script gives
           these the same geometry it gives the images. -->
        <rect id="wr_top" fill="#fff" style="display:none" />
        <rect id="wr_bot" fill="#fff" style="display:none" />
      </mask>
    </svg>
    <!-- Intro layers, visible only while #menuview.intro. DOM order is the prefab's paint
       order: background, band, the two cream slabs, then the art that fades in. The
       marble windows are not here; they are #gl lifted above this layer and masked. -->
    <div class="iv" id="iv_bg"></div>
    <img class="iv" id="iv_band" alt="">
    <img class="iv" id="iv_slabL" alt="">

    <div class="credit">recreated by <a href="https://www.arsentsn.me/" target="_blank" rel="noopener">arsentsn</a> ·

  <div id="tag">marble · webgl domain-warp</div>

  <script>

    // Lift the first-paint gate (.booting in the CSS). views/menuview.js holds it until its
    // overlay has decoded. The timeout is the backstop: no failure may leave the page blank.
    const reveal = () => document.body.classList.remove('booting');
    setTimeout(reveal, 1500);

    const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

    // Fragment shader: iterated sine/cosine domain warp, collapsed through a cosine and used
    // as the coordinate into a 1-D colour ramp. Constants: OVERVIEW.md.
    const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uPhase;    // morph phase in [0,1)
uniform float uScale;
uniform float uFlow;     // constant offset into the ramp (does not scroll)
uniform int   uIter;     // warp iterations (18)
uniform sampler2D uPal;
uniform vec2  uAmp;      // warp amplitude per axis
uniform float uMix;      // _LineRotation: collapse weight toward acc.x (menu 0.358, splash/save-slot 1.0)
uniform float uS6;       // _Scalar6: the material's own scale, the divisor under the width (menu 1.9, slate 0.78)

// The ramp texture holds sRGB bytes, written out untouched: no decode/encode round trip.

void main(){
  vec2 fc = gl_FragCoord.xy;
  fc.y = uRes.y - fc.y;                     // top-left origin
  // One divisor for BOTH axes, so the warp stays square regardless of aspect, and tied
  // to width so density is constant across viewport sizes; the height term only guards
  // degenerate sizes. uS6 is _Scalar6 (docs/SCREENS.md).
  float denom = max(uRes.y*0.005, uRes.x/uS6) / uScale;
  vec2 uv = fc / denom;

  float phase = uPhase * 6.28;              // 6.28, deliberately not 2pi (see PROVENANCE.md)
  vec2 amp = uAmp;                          // default (11.08,18.3)/467 = (0.02373, 0.03919)
  vec2 acc = uv;
  for(int i=1; i<=64; i++){                 // i = 1..uIter INCLUSIVE
    if(i > uIter) break;
    float fi = float(i);
    float a = (fi*3.0)*acc.y + phase;
    float b = (fi*3.0)*acc.x + phase;
    acc.x = fi*4.0 + amp.x*sin(a) + acc.x;
    acc.y = fi*4.0 + amp.y*cos(b) + acc.y;
  }
  // Collapse the accumulator to one scalar: _LineRotation, per-material. The menu's
  // 0.358 lands near a cosine extremum and keeps the bands broad; the splash and
  // save-slot materials use 1.0 (acc.x alone) for ~5x denser bands. The pair is taken as
  // (L, 1-L) from one uniform because the DXBC computes both weights the same way.
  float m = uMix*acc.x + (1.0-uMix)*acc.y;
  m = cos(m)*10.97 + uFlow;                  // COSINE, not sine: sine gives a busy, wrong result
  // Sign-preserving fract. At default parameters m stays in [6.2, 11.5] so this never
  // fires, but from scale >= 2 m goes negative and CLAMP_TO_EDGE pins those to texel 0.
  float u = fract(abs(m));
  if(m < 0.0) u = -u;
  vec3 col = texture2D(uPal, vec2(u, 0.5)).rgb;   // ramp holds sRGB; point-sampled, clamped
  gl_FragColor = vec4(col, 1.0);
}`;

    const cv = document.getElementById('gl');
    const gl = cv.getContext('webgl', { antialias: true, preserveDrawingBuffer: false });
    if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:20px">WebGL not available.</p>'; reveal(); }

    function sh(type, src) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const pl = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pl);
    gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);

    // ---- palette texture ----
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);  // point sampling + clamp: the ramp
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);  // is a lookup table, not an image
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    function uploadPalette(bytes) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 128, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    }
    const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
    const mkPix = ramp => {
      const px = new Uint8Array(128 * 4);
      ramp.forEach((h, i) => {
        const n = parseInt(h.slice(1), 16);
        px[i * 4] = (n >> 16) & 255; px[i * 4 + 1] = (n >> 8) & 255; px[i * 4 + 2] = n & 255; px[i * 4 + 3] = 255;
      });
      return px;
    };

    // ---- the colour ramp -------------------------------------------------------
    // A row of texels: five flat bands separated by short transitions, blended in sRGB with a
    // doubled smoothstep. Fitted against the original ramp; a linear-space lerp does noticeably
    // worse on the transition texels.
    const SEGS = [{ a: 0, b: 29 }, { a: 34, b: 45 }, { a: 49, b: 77 }, { a: 81, b: 109 }, { a: 113, b: 127 }];
    const smoothstep = t => t * t * (3.0 - 2.0 * t);

    function rampFromStops(stops) {                                  // 5 sRGB hex -> ramp texels
      const cols = stops.map(hex2rgb);
      const out = new Uint8Array(128 * 4);
      for (let x = 0; x < 128; x++) {
        let rgb = cols[cols.length - 1];
        for (let s = 0; s < SEGS.length; s++) {
          if (x <= SEGS[s].b) {
            if (x >= SEGS[s].a) { rgb = cols[s]; }
            else {
              const t = smoothstep(smoothstep((x - SEGS[s - 1].b) / (SEGS[s].a - SEGS[s - 1].b)));
              rgb = cols[s - 1].map((c, k) => c + (cols[s][k] - c) * t);
            }
            break;
          }
        }
        out[x * 4] = Math.round(rgb[0] * 255); out[x * 4 + 1] = Math.round(rgb[1] * 255); out[x * 4 + 2] = Math.round(rgb[2] * 255); out[x * 4 + 3] = 255;
      }
      return out;
    }

    // ---- stored session (localStorage) -----------------------------------------
    // `cfg` is the slider state, `customs` the saved palettes. Every access is wrapped:
    // file:// and private modes can refuse.
    const LS_KEY = 'marble.v1';
    let STORE = { cfg: null, customs: [] };
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) STORE = Object.assign(STORE, JSON.parse(raw) || {});
    } catch (e) { }
    if (!Array.isArray(STORE.customs)) STORE.customs = [];
    function writeStore() { try { localStorage.setItem(LS_KEY, JSON.stringify(STORE)); } catch (e) { } }

    // ---- presets ---------------------------------------------------------------
    // Five band colours plus the shape parameters that are live per-material reads in the game:
    // `div` (_Scalar5, larger is gentler), `flow` (_ColorOffset, which does not scroll), `line`
    // (_LineRotation) and `s6` (_Scalar6). `origin` is provenance and shows in the UI: `game` is
    // an original material's scheme, `own` is this project's, `custom` is saved locally.
    const AMP_BASE = [11.08, 18.3];
    const ampOf = div => [AMP_BASE[0] / div, AMP_BASE[1] / div];
    const MENU_LINE = 0.358;                       // MainMenuBackgroundSwirl's _LineRotation
    const MENU_S6 = 1.9;                         // ...and its _Scalar6 (the width divisor)
    const PRESETS = {
      // `label` is only what the button says; the KEY stays the URL/storage identifier, so
      // every ?preset=menu link and saved session keeps working. They are named for the
      // materials they are, not the screens they come from: the HUD row names those, and
      // one panel should not use the same two words twice. `hint` is the material's own name.
      menu: {
        label: 'menu swirl', hint: 'MainMenuBackgroundSwirl',
        stops: ['#dccf9f', '#5dc38d', '#10b6cb', '#000000', '#10b6cb'], div: 467, flow: 0.49, line: 0.358, origin: 'game'
      },
      // SaveSlotMenuSwirl, whose values are identical to the splash screen's material; only
      // the rect they draw into differs in the game. This carries the slate screen's own
      // field scale, the full 1920 at _Scalar6 0.78, a real ~2.44x calmer field than the
      // central menu. docs/SCREENS.md.
      slatemenu: {
        label: 'slate swirl', hint: 'SaveSlotMenuSwirl',
        stops: ['#ce714b', '#686a93', '#686a93', '#2d1e2f', '#686a93'], div: 534.5, flow: 0, line: 1.0, s6: 0.78, origin: 'game'
      },
      ember: { stops: ['#ffcf87', '#ff7a5c', '#b02d6e', '#150a12', '#ff9448'], div: 467, flow: 0.49, line: 0.358, origin: 'own' },
      indigo: { stops: ['#e4ebff', '#8f9cff', '#3b34a8', '#070610', '#5c46dc'], div: 534.5, flow: 0, line: 0.358, origin: 'own' },
      pewter: { stops: ['#f4f1e8', '#9fb0a8', '#3f5a5e', '#0b0f11', '#7c9aa0'], div: 500, flow: 0.24, line: 0.358, origin: 'own' },
    };
    // Reference ramps from assets/reference.js, when that file is present. They
    // replace the ramp of the preset they belong to rather than arriving as their own buttons:
    // one control per screen, matching the local reference data wherever it exists and using the
    // five-stop rebuild without it.
    if (typeof REFERENCE !== 'undefined' && REFERENCE.ramps)
      for (const k in REFERENCE.ramps)
        if (PRESETS[k]) PRESETS[k].ramp = REFERENCE.ramps[k];
    // Saved palettes, restored last so a name collision never shadows a shipped preset. A saved
    // preset is a whole snapshot: palette, material parameters and the viewer settings shipped
    // presets do not carry, freeze excluded. `auto`/`from` come back too, so a working copy
    // survives a reload knowing what it forked from.
    STORE.customs.forEach(c => {
      if (c && c.name && !PRESETS[c.name])
        PRESETS[c.name] = {
          stops: c.stops, ramp: c.ramp, div: c.div, flow: c.flow, line: c.line, s6: c.s6,
          scale: c.scale, warp: c.warp, iter: c.iter,
          auto: c.auto, from: c.from, origin: 'custom'
        };
    });

    // A preset carries either five `stops` (authored) or an explicit full-length `ramp`.
    const presetStops = P => P.ramp ? SEGS.map(s => P.ramp[(s.a + s.b) >> 1]) : P.stops.slice();
    function normalise(P) {
      P.pix = P.ramp ? mkPix(P.ramp) : rampFromStops(P.stops);
      // either form of the amplitude: a divisor, or the raw per-axis pair older data carries
      if (P.div == null) P.div = P.amp ? AMP_BASE[0] / P.amp[0] : 467;
      if (P.flow == null) P.flow = 0;
      if (P.line == null) P.line = MENU_LINE;   // preset data predating _LineRotation = the menu's
      if (P.s6 == null) P.s6 = MENU_S6;     // ...and predating _Scalar6 likewise
      if (!P.origin) P.origin = 'own';         // stored data predating the field
      return P;
    }
    for (const k in PRESETS) normalise(PRESETS[k]);

    // ---- URL parameters --------------------------------------------------------
    // Everything the panel can do is expressible here, and "copy link" writes it back out:
    //   ?preset=indigo&scale=1&speed=0.0122&flow=0.49&iter=18&amp=467&mix=0.358
    //   &c=ffcf87,ff7a5c,b02d6e,150a12,ff9448&t=0.744&ui=0&menu=0
    // `t` freezes the clock (phase = fract(t * 0.244)) independent of the speed slider.
    const QP = new URLSearchParams(location.search);
    const RENDER_PARAMS = ['preset', 'scale', 'speed', 'flow', 'iter', 'amp', 'mix', 's6', 'c', 't'];
    // A URL that pins any render parameter is authoritative: stored settings are neither read
    // nor written for that load, so saved state cannot shift a documented comparison URL.
    const URL_PINNED = RENDER_PARAMS.some(k => QP.has(k));

    // `mix` is deliberately absent: the band collapse is per-preset, so a constant here
    // would clobber the slate menu's 1.0 on every load.
    const DEFAULTS = { scale: 1, warp: 0.0122, iter: 18 };
    const cfg = Object.assign({}, DEFAULTS, (!URL_PINNED && STORE.cfg) || {});
    if (QP.has('scale')) cfg.scale = parseFloat(QP.get('scale'));
    if (QP.has('speed')) cfg.warp = parseFloat(QP.get('speed'));
    if (QP.has('iter')) cfg.iter = parseInt(QP.get('iter'));
    if (QP.has('flow')) cfg.flow = parseFloat(QP.get('flow'));
    if (QP.has('amp')) cfg.div = parseFloat(QP.get('amp'));
    if (QP.has('mix')) cfg.mix = parseFloat(QP.get('mix'));
    if (QP.has('s6')) cfg.s6 = parseFloat(QP.get('s6'));
    if (QP.has('preset')) cfg.preset = QP.get('preset');
    if (QP.has('c')) cfg.colors = QP.get('c').split(',').map(h => '#' + h.replace('#', ''));
    const DEFAULT_PRESET = Object.keys(PRESETS)[0];
    if (!PRESETS[cfg.preset]) cfg.preset = DEFAULT_PRESET;
    // None of the above is trusted: one NaN reaching a uniform blacks the whole canvas.
    const fin = (v, d) => Number.isFinite(v) ? v : d;
    cfg.scale = fin(cfg.scale, DEFAULTS.scale);
    cfg.warp = fin(cfg.warp, DEFAULTS.warp);
    cfg.iter = fin(cfg.iter, DEFAULTS.iter);
    if (cfg.flow != null) cfg.flow = fin(cfg.flow, PRESETS[cfg.preset].flow);
    if (cfg.div != null) cfg.div = fin(cfg.div, PRESETS[cfg.preset].div);
    if (cfg.mix != null) cfg.mix = fin(cfg.mix, PRESETS[cfg.preset].line);
    if (cfg.s6 != null) cfg.s6 = fin(cfg.s6, PRESETS[cfg.preset].s6);

    let state = {
      scale: cfg.scale, warp: cfg.warp, flow: 0.49, iter: cfg.iter, div: 467, mix: MENU_LINE, s6: MENU_S6,
      tFreeze: fin(QP.has('t') ? parseFloat(QP.get('t')) : null, null),
      preset: cfg.preset, hud: 0, music: 0, hudReady: false
    };

    // ---- control panel visibility ----
    // `?ui=0` forces the panel off for good; otherwise it follows panelOpen. The page boots
    // into the menu view with the panel parked, and the menu's own "options" item opens it.
    const panelEl = document.getElementById('panel'), tagEl = document.getElementById('tag');
    const UI_OFF = QP.get('ui') === '0';
    let panelOpen = !UI_OFF;
    // Portrait phone-sized: the window is a bottom sheet rather than a drawer (see the CSS).
    // Kept as a live query rather than a one-off read, since rotating a device crosses it.
    const SHEET = matchMedia('(max-width: 820px) and (orientation: portrait)');
    function setPanel(on) {
      panelOpen = on && !UI_OFF;
      // Two entrances: docked it slides out of the top edge on the menu's OutQuad, dragged it
      // fades in place. Nothing is persisted, so a reload always starts docked.
      panelEl.classList.toggle('open', panelOpen);
      // It stays mounted and hides with visibility at the end of the slide (see the CSS);
      // display is reserved for ui=0, which removes the chrome outright.
      panelEl.style.display = UI_OFF ? 'none' : '';
      armDrag(panelOpen);
      syncBar();
    }
    // The bar lights while the sheet is up, like every other active control, and names the look
    // on screen the rest of the time.
    const barEl = document.getElementById('mobilebar'), barNow = document.getElementById('mb_now');
    function syncBar() {
      barEl.classList.toggle('on', panelOpen);
      barEl.setAttribute('aria-expanded', panelOpen ? 'true' : 'false');
      barEl.style.display = UI_OFF ? 'none' : '';
      const P = PRESETS[state.preset];
      barNow.textContent = P && P.auto ? 'unnamed copy' : ((P && P.label) || state.preset);
    }
    barEl.onclick = () => setPanel(!panelOpen);
    // A sheet covers the thing it edits, so the field showing above it is also the way out:
    // tapping the marble puts the controls away. Sheet mode only, since a docked drawer is not
    // covering anything and closing it on a stray click would be a trap. pointerdown rather than
    // click, so the dismissal happens on touch rather than on release.
    addEventListener('pointerdown', e => {
      if (!SHEET.matches || !panelOpen) return;
      const t = e.target;
      if (t && t.closest && t.closest('#panel, #mobilebar')) return;   // the sheet, and its handle
      setPanel(false);
    });
    // Rotating into or out of portrait changes which layout the window is in, so the dock state
    // and the drag arming both have to be reconsidered rather than left as the other mode left
    // them.
    SHEET.addEventListener('change', () => { dockPanel(); armDrag(panelOpen); });

    // ---- dragging the window ---------------------------------------------------
    // Armed on a timer rather than on transitionend: grabbing mid-slide fights the transform
    // the transition is still animating, but transitionend never fires under headless virtual
    // time (docs/TOOLING.md), which would leave dragging dead in every --screenshot run.
    const SLIDE_MS = 360;
    const dragHandle = panelEl.querySelector('.hdr');
    let panelPos = null, dragging = null, armed = false, armTimer = 0;
    function armDrag(on) {
      clearTimeout(armTimer); armed = false; panelEl.classList.remove('grab');
      // A sheet is pinned to the bottom edge, so dragging it would only fight the scroll inside it.
      if (!on || SHEET.matches) return;
      const wait = document.body.classList.contains('booting') ? 0 : SLIDE_MS;
      armTimer = setTimeout(() => { armed = true; panelEl.classList.add('grab'); }, wait);
    }
    // Clamped so a strip of the header always stays on screen. Called from resize() too: a
    // viewport shrinking under a floating window would otherwise strand it offscreen.
    const KEEP = 56;
    function placePanel(x, y) {
      const w = panelEl.offsetWidth;
      panelPos = {
        x: Math.min(Math.max(x, KEEP - w), innerWidth - KEEP),
        y: Math.min(Math.max(y, 0), innerHeight - KEEP)
      };
      panelEl.classList.add('moved');
      panelEl.style.left = panelPos.x + 'px';
      panelEl.style.top = panelPos.y + 'px';
    }
    function clampPanel() { if (panelPos) placePanel(panelPos.x, panelPos.y); }
    // Back to the dock, and to the menu-matched geometry.
    function dockPanel() {
      panelPos = null;
      panelEl.classList.remove('moved');
      panelEl.style.left = panelEl.style.top = '';
    }
    // The dragged position is deliberately not remembered: the dock and its slide are part of
    // what this reproduces, and a stored position would shift a documented comparison URL.
    dragHandle.addEventListener('pointerdown', e => {
      // left button only, and never a grab starting on one of the header's icons
      if (!armed || e.button !== 0 || e.target.closest('button')) return;
      const r = panelEl.getBoundingClientRect();
      dragging = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top };
      panelEl.classList.add('dragging');
      dragHandle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    dragHandle.addEventListener('pointermove', e => {
      if (dragging && e.pointerId === dragging.id) placePanel(e.clientX - dragging.dx, e.clientY - dragging.dy);
    });
    const endDrag = () => { if (!dragging) return; dragging = null; panelEl.classList.remove('dragging'); };
    dragHandle.addEventListener('pointerup', endDrag);
    dragHandle.addEventListener('pointercancel', endDrag);
    // double-click the header to re-dock without closing
    dragHandle.addEventListener('dblclick', e => {
      if (e.target.closest('button')) return;
      dockPanel();
    });
    // `ui=0` means no page chrome at all, so a wallpaper or embed carries no corner tag.
    // Keyed off what is on screen rather than state.hud: the exit animation keeps the menu
    // layers up for a second after the toggle flips, and the tag must not reappear over them.
    function syncTag() {
      const shown = document.getElementById('menuview').classList.contains('on')
        || document.getElementById('slateview').classList.contains('on');
      tagEl.style.display = (UI_OFF || shown) ? 'none' : '';
    }
    setPanel(panelOpen); syncTag();

    // ---- the frame ------------------------------------------------------------
    // One draw(), plus a loop that stays scheduled only while something moves. Anything that
    // changes the image while the loop is stopped calls requestFrame() for a single redraw,
    // which is also what repaints after a resize clears the canvas.
    const U = n => gl.getUniformLocation(prog, n);
    const uRes = U('uRes'), uPhase = U('uPhase'), uScale = U('uScale'), uFlow = U('uFlow'),
      uIter = U('uIter'), uAmp = U('uAmp'), uMix = U('uMix'), uS6 = U('uS6');
    gl.uniform1i(U('uPal'), 0);

    let phase01 = 0, lastTs = null, rafId = 0, booted = false;
    const phaseNow = () => state.tFreeze !== null ? ((state.tFreeze * 0.244) % 1 + 1) % 1 : phase01;
    const moving = () => state.warp > 0 && state.tFreeze === null;

    function draw() {
      gl.uniform2f(uRes, cv.width, cv.height);
      gl.uniform1f(uPhase, phaseNow());
      gl.uniform1f(uScale, state.scale);
      gl.uniform1f(uFlow, state.flow);
      gl.uniform1i(uIter, state.iter);
      const amp = ampOf(state.div);
      gl.uniform2f(uAmp, amp[0], amp[1]);
      gl.uniform1f(uMix, state.mix);
      gl.uniform1f(uS6, state.s6);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      updateReadout();
    }
    // phase accumulates per frame, so moving the speed slider changes tempo without jumping
    function frame(ts) {
      const dt = lastTs === null ? 0 : Math.min((ts - lastTs) / 1000, 0.1);
      lastTs = ts;
      if (moving()) phase01 = (phase01 + dt * state.warp) % 1;
      draw();
      rafId = moving() ? requestAnimationFrame(frame) : 0;
    }
    function requestFrame() { if (!rafId) { lastTs = null; rafId = requestAnimationFrame(frame); } }

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; gl.viewport(0, 0, cv.width, cv.height);
      clampPanel();                           // a floating window must not fall off a shrinking viewport
      requestFrame();
    }                       // the resize cleared the buffer, so repaint
    addEventListener('resize', resize);

    // ---- readout: the derived numbers ----
    // The slider's speed translates into a loop of a minute or two. Phase is what you quote
    // to reproduce a frame, so it is on screen rather than in the console.
    const roEl = document.getElementById('readout');
    let roAt = 0;
    function updateReadout() {
      const now = performance.now();
      // ~6 Hz while animating, immediate when not. Keyed off moving() rather than rafId: on
      // the last frame before the loop stops rafId is still set, so a throttled skip there
      // would leave the readout showing a stale loop figure instead of "still".
      if (moving() && now - roAt < 150) return;
      roAt = now;
      syncLoop();                             // the thumb and the clock chip read back here
      const bits = [], p = phaseNow();
      // Neither `t` nor the phase it derives from: the loop row's own chip carries the clock,
      // and this line only adds what that chip cannot say, which is where it falls in seconds.
      bits.push(state.warp > 0
        ? 'loop ' + (p / state.warp).toFixed(0) + ' / ' + (1 / state.warp).toFixed(0) + ' s'
        : 'still');
      // The warp's pixel scale. It reports here rather than on either slider because `scale`
      // and `field scale` are the same knob: denom = width/(s6*scale), so only their product
      // reaches the render. In CSS pixels, not device pixels, since the CSS figure is the
      // dpr-invariant one this project quotes as evidence: 1010.5 at 1920 wide.
      bits.push('field ' + (Math.max(innerHeight * 0.005, innerWidth / state.s6) / state.scale).toFixed(1) + ' px');
      roEl.textContent = bits.join(' · ');
    }

    // ---- persistence -----------------------------------------------------------
    function saveCfg() {
      if (URL_PINNED) return;                  // a pinned URL neither reads nor writes state
      STORE.cfg = {
        scale: state.scale, warp: state.warp, flow: state.flow, iter: state.iter,
        div: state.div, mix: state.mix, s6: state.s6, preset: state.preset,
        colors: pickers.map(el => el.value)
      };
      writeStore();
    }
    let saveTimer = 0;
    function onChange() {
      if (!booted) return;
      requestFrame();
      // also from here, not only draw(): a change that produces no frame (speed dropped to 0
      // while one was already scheduled) would otherwise leave stale text on screen
      updateReadout();
      syncPlay();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { saveFork(); pruneFork(); saveCfg(); }, 300);
    }

    // ---- colour pickers: one per band ----
    const pickers = SEGS.map((_, i) => document.getElementById('c' + i));
    function rebuildPalette() { uploadPalette(rampFromStops(pickers.map(el => el.value))); }
    pickers.forEach(el => {
      el.addEventListener('input', e => {
        if (e && e.isTrusted) forkPreset();       // a swatch is part of the look, so it forks too
        rebuildPalette(); onChange();
      });
    });
    // One predicate for "the swatches no longer match the preset": it decides whether a working
    // copy still differs from its origin and whether a shared link needs to carry the colours.
    function paletteEdited() {
      const now = pickers.map(el => el.value.slice(1).toLowerCase());
      const def = presetStops(basePreset()).map(h => h.slice(1).toLowerCase());
      return now.join() !== def.join();
    }

    // ---- sliders ---------------------------------------------------------------
    function bind(id, key, fmt, after) {
      const el = document.getElementById('s_' + id), v = document.getElementById('v_' + id);
      el.value = state[key];
      // --p is how far along the track the value sits; the painted track needs it (see CSS)
      const mark = () => {
        const lo = parseFloat(el.min), hi = parseFloat(el.max);
        el.style.setProperty('--p', (100 * (parseFloat(el.value) - lo) / (hi - lo)).toFixed(2) + '%');
      };
      // isTrusted is the line between a hand on the slider and setSlider or applyPreset moving
      // it: only the first forks. The fork captures the state before this event, which the
      // debounced saveFork then brings up to date.
      const upd = e => {
        if (e && e.isTrusted) forkPreset();
        state[key] = parseFloat(el.value); if (v) v.textContent = fmt(state[key]);
        mark(); if (after) after(); onChange();
      };
      el.addEventListener('input', upd); upd();
      // Double-click puts one slider back where the active preset wants it: undoing one tweak
      // without giving up the rest, which is the half of a "reset settings" button worth keeping
      // now that picking a preset resets everything. Goes through setSlider rather than a trusted
      // event, so moving toward the preset never forks a working copy away from it.
      el.addEventListener('dblclick', () => {
        const b = baseline()[key];
        if (b != null && parseFloat(el.value) !== b) setSlider(id, b);
      });
    }
    function setSlider(id, v) {
      const el = document.getElementById('s_' + id);
      el.value = v; el.dispatchEvent(new Event('input'));
    }

    // ---- what "unedited" means -------------------------------------------------
    // The look a working copy is measured against: for a copy, the preset it was forked from;
    // for anything else, itself. Everything that answers "is this edited?" runs through here,
    // which is what lets a copy that has been hand-edited back to its origin retire itself.
    function basePreset() {
      const P = PRESETS[state.preset];
      return (P && P.auto && PRESETS[P.from]) ? PRESETS[P.from] : P;
    }
    // Per-preset values (palette offset, warp width, bands, field scale) come from the preset
    // itself; scale/speed/iterations from a saved preset's own values if it has them, otherwise
    // from DEFAULTS, since the shipped presets are materials and do not carry viewer settings.
    function baseline() {
      const P = basePreset();
      return {
        scale: P.scale != null ? P.scale : DEFAULTS.scale,
        warp: P.warp != null ? P.warp : DEFAULTS.warp,
        iter: P.iter != null ? P.iter : DEFAULTS.iter,
        flow: P.flow, div: P.div, mix: P.line, s6: P.s6
      };
    }
    // The four material values on their own: exactly what a preset switch overwrites, which
    // is what the screen switches check before applying a screen's own material over edits.
    function materialEdited() {
      const b = baseline();
      return state.flow !== b.flow || state.div !== b.div
        || state.mix !== b.mix || state.s6 !== b.s6;
    }
    // ---- presets: grouped by provenance ---------------------------------------
    // The caption that matters is which presets carry a scheme of the studied game's. This
    // project's own palettes and saved ones are both "not the game's", so they share a
    // group; the per-button tooltips tell them apart.
    const GROUPS = [{ origins: ['game'], cap: 'original' },
    { origins: ['own', 'custom'], cap: 'presets' }];
    const HINTS = {
      game: 'the original material’s scheme: its reference ramp where assets/reference.js '
        + 'is present, rebuilt from its five band colours where it is not. Changes the '
        + 'swirl only: the HUD row is what changes the screen',
      own: 'this project’s own palette',
      custom: 'preset you saved in this browser: colours and every slider'
    };
    let presetBtns = [];
    function buildPresets() {
      const host = document.getElementById('presetgroups');
      host.textContent = '';
      presetBtns = [];
      const label = k => PRESETS[k].label || k;
      for (const { origins, cap: caption } of GROUPS) {
        const names = Object.keys(PRESETS).filter(k => origins.includes(PRESETS[k].origin));
        if (!names.length) continue;
        const cap = document.createElement('span');
        cap.className = 'cap'; cap.textContent = caption; host.appendChild(cap);
        const row = document.createElement('div');
        // Long labels get the wider two-per-line track. A saved pill counts as long whatever
        // its name, since its delete button eats ~22px of the track.
        const roomy = n => label(n).length > 8 || PRESETS[n].origin === 'custom';
        row.className = 'btnrow' + (names.some(roomy) ? ' wide' : '');
        host.appendChild(row);
        for (const k of names) {
          const P = PRESETS[k], origin = P.origin;
          const from = () => PRESETS[P.from] ? label(P.from) : P.from;
          // On a working copy the × is the revert: dropping the copy lands on what it was forked
          // from, which is every setting back at once. A saved preset has no origin to go back
          // to, so deleting one falls through to the first preset in the row.
          const del = () => {
            const x = document.createElement('button');
            x.className = 'del'; x.textContent = '×';
            x.title = P.auto ? 'discard this working copy and go back to "' + from() + '"'
              : 'delete "' + k + '"';
            x.setAttribute('aria-label', x.title);
            x.onclick = () => deleteCustom(k, P.from);
            return x;
          };
          // The unnamed working copy is never something you click to select: it exists only while
          // you are on it, so it is the name field rather than a button, and typing a name keeps
          // it. Inactive copies fall through to the ordinary button so they stay reachable.
          if (P.auto && k === state.preset) {
            const pill = document.createElement('div');
            pill.className = 'pill scratch';
            const f = document.createElement('input');
            f.type = 'text'; f.className = 'nameit'; f.maxLength = 24;
            f.placeholder = 'name this look';
            f.title = 'your working copy of "' + from() + '": every change lands here. Name it '
              + 'and it is kept for good; leave it blank and it goes when you pick another '
              + 'preset';
            f.setAttribute('aria-label', f.title);
            f.addEventListener('keydown', e => {
              if (e.key === 'Enter') { e.preventDefault(); f.blur(); }
              else if (e.key === 'Escape') { f.value = ''; f.blur(); }
            });
            f.addEventListener('blur', () => keepAs(k, f));
            pill.append(f, del()); row.appendChild(pill);
            continue;
          }
          const b = document.createElement('button');
          b.textContent = label(k); b.dataset.preset = k;
          // a working copy names what it forked from; anything else leads with the material's
          // own name, where the preset carries one
          b.title = P.auto
            ? 'a working copy of "' + from() + '", left unnamed: pick it to go on editing it'
            : (P.hint ? P.hint + ' · ' : '') + HINTS[origin];
          b.onclick = () => pickPreset(k);
          presetBtns.push(b);
          if (origin === 'custom') {                 // pill + its own delete
            const pill = document.createElement('div');
            pill.className = 'pill';
            pill.append(b, del()); row.appendChild(pill);
          } else {
            row.appendChild(b);
          }
        }
      }

    }
    function highlightPreset() {
      presetBtns.forEach(b => b.classList.toggle('on', b.dataset.preset === state.preset));
      syncBar();                              // the portrait bar names the look, so it moves too
    }
    function applyPreset(name) {
      state.preset = name;
      const P = PRESETS[name];
      uploadPalette(P.pix);
      const hex = presetStops(P);
      pickers.forEach((el, i) => { el.value = hex[i]; });
      setSlider('flow', P.flow);                    // flow, warp width, band collapse and
      setSlider('amp', P.div);                     // field scale are all per-preset
      setSlider('mix', P.line);                    // (per-material live reads)
      setSlider('s6', P.s6);
      // Every preset lands on a fully specified state, including the three the shipped ones do not
      // carry and which fall back to DEFAULTS. Otherwise a preset cannot set the thing it names:
      // scale and field scale divide one denominator, so a leftover zoom redefines the field.
      setSlider('scale', P.scale != null ? P.scale : DEFAULTS.scale);
      setSlider('warp', P.warp != null ? P.warp : DEFAULTS.warp);
      setSlider('iter', P.iter != null ? P.iter : DEFAULTS.iter);
      highlightPreset();
    }
    // Picking one from the row, which is also the panel's reset: an unsaved working copy is a
    // scratch buffer, so leaving it for another preset discards it. That is what makes clicking
    // the preset a copy was forked from a complete revert, colours and sliders together, and
    // what keeps the row from filling with abandoned copies of every preset you have touched.
    function pickPreset(name) {
      const P = PRESETS[state.preset];
      const drop = (P && P.auto && state.preset !== name) ? state.preset : null;
      applyPreset(name);
      if (drop) { dropCustom(drop); buildPresets(); }
      onChange();
    }
    // A preset is a look and nothing else: picking one never moves the screen, not even the two
    // that are a screen's own material. The HUD row is the only control that does
    // (views/menuview.js's screenPreset).
    // ---- working copies -------------------------------------------------------
    // Change a preset by hand and you are not on it any more: the panel forks a working copy and
    // switches to it. Everything a preset carries forks; the freeze does not, since it pins a
    // frame rather than describing a look. Edits keep updating the same copy, naming it keeps it,
    // and a copy that matches its origin again retires itself.
    function panelEntry(name) {
      return {
        name, stops: pickers.map(el => el.value), div: state.div, flow: state.flow,
        line: state.mix, s6: state.s6, scale: state.scale, warp: state.warp, iter: state.iter
      };
    }
    const storedCustom = name => STORE.customs.find(c => c.name === name);
    // Only ever reached from a trusted event, so setSlider and applyPreset never fork.
    function forkPreset() {
      const P = PRESETS[state.preset];
      if (P && P.auto) return;                  // already editing my own copy
      let n = 1; while (PRESETS['custom ' + n]) n++;
      const name = 'custom ' + n;
      const entry = Object.assign(panelEntry(name), { auto: true, from: state.preset });
      // A slider edit leaves the colours alone, so a reference ramp comes along rather than being
      // rebuilt from five stops through the fitted transitions and their error (OVERVIEW.md).
      if (P && P.ramp && !paletteEdited()) entry.ramp = P.ramp;
      STORE.customs.push(entry); writeStore();
      PRESETS[name] = normalise(Object.assign({ origin: 'custom' }, entry, { name: undefined }));
      state.preset = name;
      buildPresets();
    }
    // The copy tracks the panel, on the same settle as the session write: one store hit per drag.
    function saveFork() {
      const P = PRESETS[state.preset];
      if (!P || !P.auto) return;
      Object.assign(P, panelEntry(), { name: undefined });
      if (paletteEdited()) delete P.ramp;       // an edited swatch is no longer the reference row
      P.pix = P.ramp ? mkPix(P.ramp) : rampFromStops(P.stops);
      const c = storedCustom(state.preset);
      if (c) {
        Object.assign(c, panelEntry(state.preset));
        if (P.ramp) c.ramp = P.ramp; else delete c.ramp;
      }
      writeStore();
    }
    // A copy that matches what it was forked from is noise in the row, so it goes and its origin
    // lights up again. This is what makes undoing an edit by hand land back on the preset rather
    // than on an identical copy of it.
    function pruneFork() {
      const P = PRESETS[state.preset];
      if (!P || !P.auto || !PRESETS[P.from]) return;
      if (paletteEdited() || materialEdited()) return;
      const b = baseline();
      if (state.scale !== b.scale || state.warp !== b.warp || state.iter !== b.iter) return;
      deleteCustom(state.preset, P.from);
    }
    // Naming a working copy is what keeps it, so there is no save button: a row of "custom 1",
    // "custom 2", "custom 3" is not something anyone comes back to. Named, the entry stops
    // tracking the panel, stops retiring itself and stops being discarded. Blank leaves it
    // scratch, the no-op this is called with whenever the field is blurred untouched.
    function keepAs(old, field) {
      const P = PRESETS[old], name = field.value.trim().slice(0, 24);
      if (!P || !P.auto || !name) return;
      if (PRESETS[name] && name !== old) {          // the row cannot hold two of a name
        field.value = ''; field.placeholder = '"' + name + '" is taken'; return;
      }
      delete P.auto; delete P.from;
      delete PRESETS[old]; PRESETS[name] = P;
      const c = storedCustom(old);
      if (c) { delete c.auto; delete c.from; c.name = name; }
      state.preset = name;
      writeStore();
      buildPresets(); onChange();
    }
    // Forgetting a preset, without touching what is on screen: pickPreset needs that half on its
    // own, since it has already moved to the preset it is keeping.
    function dropCustom(name) {
      STORE.customs = STORE.customs.filter(c => c.name !== name); writeStore();
      delete PRESETS[name];
    }
    function deleteCustom(name, fallback) {
      dropCustom(name);
      if (state.preset === name) applyPreset(PRESETS[fallback] ? fallback : DEFAULT_PRESET);
      buildPresets(); onChange();
    }

    // ---- the loop row: scrub, freeze, play ------------------------------------
    // t and phase are one axis, so one row carries both: the slider is the phase, the number is
    // the clock value, the play toggle is the freeze. Scrubbing freezes, the way a video scrubber
    // pauses, and there is no second pause control.
    const T_PERIOD = 1 / 0.244;               // one loop in t units: 4.098...
    const tEl = document.getElementById('s_t');
    const phEl = document.getElementById('s_phase');
    const playBtn = document.getElementById('b_play');
    // The whole-period part of an explicitly given t is kept, so scrubbing a ?t=100.744 URL
    // stays in that period instead of quietly collapsing to the first one.
    let tBase = state.tFreeze === null ? 0 : Math.floor(state.tFreeze / T_PERIOD) * T_PERIOD;
    // Three decimals: finer than the scrubber's own 0.001 phase step (0.001 of t is 0.000244 of
    // a phase), so nothing the row can reach is rounded away.
    const tFor = p => +(tBase + p / 0.244).toFixed(3);
    const fmtT = t => t.toFixed(3);
    // The clock value that reproduces the frame on screen, frozen or not.
    const tNow = () => state.tFreeze !== null ? state.tFreeze : tFor(phase01);
    function rebase(t) { if (t !== null) tBase = Math.floor(t / T_PERIOD) * T_PERIOD; }
    // Leaving freeze resumes from the frame on screen, not from wherever the live clock was
    // when it was frozen: with the phase visible on the slider, a jump there is a jump.
    function resume(t) { if (t === null && state.tFreeze !== null) phase01 = phaseNow(); }
    function setFreeze(t) {
      resume(t); state.tFreeze = t; rebase(t);
      syncClock();                            // before onChange, so the chip lands on the click
      onChange();
    }
    // Not setFreeze: writing the field back mid-typing would eat a trailing '.'
    tEl.addEventListener('input', () => {
      const v = tEl.value.trim(), n = parseFloat(v);
      const t = (v === '' || !isFinite(n)) ? null : n;
      resume(t); state.tFreeze = t; rebase(t);
      onChange();
    });
    // A drag owns the thumb: the live animation must not write over it mid-gesture.
    let scrubbing = false;
    phEl.addEventListener('pointerdown', () => { scrubbing = true; });
    addEventListener('pointerup', () => { if (scrubbing) { scrubbing = false; syncLoop(); } });
    phEl.addEventListener('input', () => { setFreeze(tFor(parseFloat(phEl.value))); });
    playBtn.onclick = () => { setFreeze(state.tFreeze === null ? tFor(phase01) : null); };
    // The thumb rides the animation on the readout's throttle: across such a long loop,
    // this rate is already finer than the eye asks for.
    function syncLoop() {
      const p = phaseNow();
      if (!scrubbing) phEl.value = p;
      syncClock();
      phEl.style.setProperty('--p', (100 * p).toFixed(2) + '%');
      phEl.setAttribute('aria-valuetext', 'phase ' + p.toFixed(3) + (state.warp > 0
        ? ', ' + (p / state.warp).toFixed(0) + ' of ' + (1 / state.warp).toFixed(0) + ' seconds' : ''));
    }
    // The chip carries the clock whether or not it is frozen, so the figure the URL and the docs
    // quote is on screen without having to freeze first. Never written while it has focus: that
    // would rewrite what is being typed, including a cleared field mid-edit.
    function syncClock() {
      if (document.activeElement !== tEl) tEl.value = fmtT(tNow());
    }
    // Lit when frozen, like every other active toggle in the window, and showing the glyph for
    // what a click does. Speed 0 is a third state: not frozen, but nothing moves either.
    function syncPlay() {
      const frozen = state.tFreeze !== null;
      playBtn.classList.toggle('on', frozen);
      playBtn.setAttribute('aria-pressed', frozen ? 'true' : 'false');
      playBtn.setAttribute('aria-label', frozen ? 'play' : 'pause');
      playBtn.title = frozen ? 'run live again (space)'
        : state.warp > 0 ? 'freeze this frame (space)'
          : 'freeze this frame (space); warp speed is 0, so nothing is moving';
      playBtn.querySelector('.i_play').style.display = frozen ? '' : 'none';
      playBtn.querySelector('.i_pause').style.display = frozen ? 'none' : '';
    }

    // ---- real fullscreen ----
    const fullBtn = document.getElementById('b_full');
    fullBtn.onclick = () => {
      if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); }
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { });
    };
    // F11 is the browser's own fullscreen, not the Fullscreen API: it fires no
    // fullscreenchange and leaves document.fullscreenElement null, so tracking that property
    // alone leaves the icon dark while the page is plainly fullscreen. It does flip the
    // display-mode media query, so the lit state ORs both sources.
    const fsMq = matchMedia('(display-mode: fullscreen)');
    function syncFull() {
      const on = !!document.fullscreenElement || fsMq.matches;
      fullBtn.classList.toggle('on', on);
      fullBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      // F11 fullscreen cannot be released programmatically; only the user's F11 can
      fullBtn.title = on && !document.fullscreenElement ? 'fullscreen (exit with F11)'
        : 'fullscreen (f)';
    }
    document.addEventListener('fullscreenchange', syncFull);
    if (fsMq.addEventListener) fsMq.addEventListener('change', syncFull);
    else if (fsMq.addListener) fsMq.addListener(syncFull);   // older Safari

    // ---- copy link: the panel's state as a URL --------------------------------
    function shareURL() {
      const p = new URLSearchParams();
      p.set('preset', state.preset);
      p.set('scale', state.scale);
      p.set('speed', state.warp);
      p.set('flow', state.flow);
      p.set('iter', state.iter);
      p.set('amp', state.div);
      p.set('mix', state.mix);
      p.set('s6', state.s6);
      // only when actually edited: the same predicate that lights the colours reset
      if (paletteEdited()) p.set('c', pickers.map(el => el.value.slice(1).toLowerCase()).join(','));
      if (state.tFreeze !== null) p.set('t', state.tFreeze);
      if (state.hudReady && !state.hud) p.set('menu', '0');
      // location.href, not origin+pathname: origin is the string "null" on file://
      return location.href.split(/[?#]/)[0] + '?' + p.toString();
    }
    const linkBtn = document.getElementById('b_link');
    linkBtn.onclick = () => {
      const text = shareURL();
      const done = () => { linkBtn.textContent = 'copied'; setTimeout(() => { linkBtn.textContent = 'copy link'; }, 900); };
      const manual = () => {                    // clipboard API refused (permission, or no gesture)
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { prompt('copy this URL', text); }
        ta.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(text).then(done, manual);
      else manual();
    };

    // ---- save png at an arbitrary size ---------------------------------------
    // preserveDrawingBuffer is false, so the pixels are valid only until the frame is
    // composited: readPixels must happen in the same task as the draw, which rules out
    // toBlob on the GL canvas. readPixels is bottom-up, so rows are flipped on the way out.
    document.getElementById('b_png').onclick = () => {
      // 2x the viewport, with the real pixel size in the filename. Clamped so a very wide
      // window cannot ask for a canvas the GPU will refuse.
      const k = Math.min(2, 7680 / Math.max(innerWidth, innerHeight));
      const w = Math.round(innerWidth * k), h = Math.round(innerHeight * k);
      const ow = cv.width, oh = cv.height;
      cv.width = w; cv.height = h; gl.viewport(0, 0, w, h);
      draw();
      const px = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      cv.width = ow; cv.height = oh; gl.viewport(0, 0, ow, oh); requestFrame();
      const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
      const ctx = c2.getContext('2d');
      const img = ctx.createImageData(w, h), stride = w * 4;
      for (let y = 0; y < h; y++) img.data.set(px.subarray((h - 1 - y) * stride, (h - y) * stride), y * stride);
      ctx.putImageData(img, 0, 0);
      c2.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        // Preset names are typed by hand now, so anything at all can reach this: stripped to
        // letters and digits rather than only whitespace, since a "/" or ":" in a download name
        // is a path the browser has to guess at.
        const tag = state.preset.replace(/[^a-z0-9]+/gi, '') || 'custom';
        a.download = `marble-${tag}-${w}x${h}-p${phaseNow().toFixed(3)}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }, 'image/png');
    };

    // ---- keyboard -------------------------------------------------------------
    // arrows step the phase (shift for a coarse step), space plays/pauses, 1-5 pick a preset,
    // h toggles the panel, f fullscreen. Stepping nudges the freeze value when frozen and the
    // live phase otherwise.
    function stepPhase(d) {
      if (state.tFreeze !== null) setFreeze(+(state.tFreeze + d / 0.244).toFixed(3));
      else { phase01 = ((phase01 + d) % 1 + 1) % 1; requestFrame(); }
    }
    addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      const coarse = e.shiftKey ? 0.02 : 0.002;
      if (e.key === 'ArrowLeft') { stepPhase(-coarse); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { stepPhase(+coarse); e.preventDefault(); }
      // space would also fire a focused button, which is where it belongs in that case
      else if (e.key === ' ' && !(t && t.tagName === 'BUTTON')) { playBtn.onclick(); e.preventDefault(); }
      else if (e.key === 'h') { setPanel(!panelOpen); }
      else if (e.key === 'f') { fullBtn.onclick(); }
      // 1-9, not 1-5: five presets ship, so a row that stopped at five could reach every one of
      // them and none of yours, which are the only entries you had to make yourself.
      else if (e.key >= '1' && e.key <= '9') {
        const k = presetBtns[+e.key - 1];
        if (k) pickPreset(k.dataset.preset);
      }
    });

    // ---- boot -----------------------------------------------------------------
    buildPresets();
    bind('scale', 'scale', x => x.toFixed(2));
    bind('warp', 'warp', x => x.toFixed(4));
    bind('flow', 'flow', x => x.toFixed(2));
    bind('iter', 'iter', x => x.toFixed(0));
    bind('amp', 'div', x => x.toFixed(1));
    bind('mix', 'mix', x => x.toFixed(3));
    bind('s6', 's6', x => x.toFixed(2));
    applyPreset(cfg.preset);
    // the preset supplies its own shape; a URL or a stored session then overrides it
    setSlider('scale', cfg.scale);          // always set: DEFAULTS, then storage, then the URL
    setSlider('warp', cfg.warp);
    setSlider('iter', cfg.iter);
    if (cfg.flow != null) setSlider('flow', cfg.flow);
    if (cfg.div != null) setSlider('amp', cfg.div);
    if (cfg.mix != null) setSlider('mix', cfg.mix);
    if (cfg.s6 != null) setSlider('s6', cfg.s6);
    if (cfg.colors) {
      cfg.colors.forEach((c, i) => { if (pickers[i] && /^#[0-9a-f]{6}$/i.test(c)) pickers[i].value = c; });
      rebuildPalette();
    }
    syncFull(); syncPlay(); syncLoop();     // syncLoop fills the clock chip, live or frozen
    booted = true;
    resize();

    // views/menuview.js below takes ownership of the first-paint gate, holding the paint until
    // whichever tier it can build is ready. The 1.5 s backstop above covers it never loading.
  </script>

  <!-- The reconstructed screens (docs/SCREENS.md). Probes assets/ and builds the fullest
     tier those assets allow. Must come after the main script: it builds on that script's
     state and takes over the paint gate. -->
  <script src="views/menuview.js"></script>
</body>

</html>
